version: '3.8'

services:
  ticket-processor:
    build: .
    container_name: ticket-processor
    ports:
      - "5001:5001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - PROXYAPI_API_KEY=${PROXYAPI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.proxyapi.ru/v1}
      - LLM_PROVIDER=${LLM_PROVIDER:-gigachat}
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-}
      - GIGACHAT_VERIFY_SSL_CERTS=${GIGACHAT_VERIFY_SSL_CERTS:-false}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - DEBUG=${DEBUG:-False}
      - RATE_LIMIT=${RATE_LIMIT:-5}
      - DATABASE_URL=sqlite:///tickets.db
    volumes:
      - ./tickets.db:/app/tickets.db
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/triage", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"text":"test","client_id":"health"}']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
