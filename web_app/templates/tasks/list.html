{% extends "base.html" %}
{% block content %}
<h1>Задачи ({{ status }})</h1>
<ul>
{% for it in items %}
  <li>
    [{{ it.item_type }}] {{ it.title }}
    {% if it.needs_review %}<span style="color:red">требует проверки</span>{% endif %}
    {% if it.status == 'open' %}
      <form method="post" action="{{ url_for('tasks.mark_done', item_id=it.id) }}" style="display:inline">
        <button type="submit">Выполнено</button>
      </form>
    {% endif %}
  </li>
{% endfor %}
</ul>
{% endblock %}
